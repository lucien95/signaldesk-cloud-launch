<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">SignalDesk runtime and private VPC architecture</title>
  <desc id="desc">The customer and operations browser reaches one Cloud Run service containing a Next.js static interface and FastAPI API. FastAPI reaches private Cloud SQL through Direct VPC egress, a custom subnet, and Private Service Access. A dedicated runtime service account accesses Secret Manager and the Cloud SQL integration. Structured logs, monitoring, health checks, scaling ceilings, and budget alerts surround the request path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#103955"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecf7ff"/><stop offset="1" stop-color="#d8edff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#effbf4"/><stop offset="1" stop-color="#daf3e5"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9e8"/><stop offset="1" stop-color="#ffefc5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#00111f" flood-opacity=".2"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#438be3"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#22a06b"/></marker>
    <style>
      .h1{font:700 38px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}.sub{font:400 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#bfd5e6}
      .lane{font:700 17px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:2px;fill:#8dc0e5}.title{font:700 22px Inter,ui-sans-serif,system-ui,sans-serif;fill:#122d43}.copy{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#3d566a}.small{font:600 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#587085}.footerLabel{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#d9ebf8}.footerCopy{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#c6dceb}.label{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#d9ebf8;paint-order:stroke;stroke:#0c2b44;stroke-width:6px;stroke-linejoin:round}
      .boundary{fill:#fff;fill-opacity:.035;stroke:#76b0d9;stroke-width:2;stroke-dasharray:10 8}.vpc{fill:#3b82f6;fill-opacity:.05;stroke:#5ca4eb;stroke-width:2;stroke-dasharray:8 7}.box{stroke-width:2;rx:18;filter:url(#shadow)}.b{fill:url(#blue);stroke:#5ca4eb}.g{fill:url(#green);stroke:#55bd89}.a{fill:url(#amber);stroke:#e5aa2b}.n{fill:#f4f7fa;stroke:#a7bac9}
      .blueLine{fill:none;stroke:#438be3;stroke-width:4;marker-end:url(#arrowBlue)}.greenLine{fill:none;stroke:#22a06b;stroke-width:4;marker-end:url(#arrowGreen)}.dash{stroke-dasharray:9 7}
    </style>
  </defs>
  <rect width="1800" height="1040" fill="url(#bg)"/>
  <text x="65" y="67" class="h1">SignalDesk — runtime, identity, and private VPC path</text>
  <text x="65" y="103" class="sub">The request path is public only at Cloud Run. Database traffic stays on private Google Cloud networking.</text>

  <rect x="265" y="145" width="1470" height="815" rx="28" class="boundary"/>
  <text x="300" y="180" class="lane">GOOGLE CLOUD PROJECT · US-EAST1</text>

  <text x="55" y="238" class="lane">CLIENTS</text>
  <rect x="50" y="265" width="175" height="135" class="box n"/>
  <text x="137" y="310" text-anchor="middle" class="title">Browser</text>
  <text x="137" y="342" text-anchor="middle" class="copy">Customer booking</text>
  <text x="137" y="369" text-anchor="middle" class="copy">Operations board</text>

  <text x="300" y="238" class="lane">MANAGED APPLICATION RUNTIME</text>
  <rect x="300" y="265" width="430" height="275" class="box b"/>
  <text x="515" y="307" text-anchor="middle" class="title">Cloud Run · signaldesk-dev</text>
  <rect x="335" y="335" width="360" height="68" rx="12" fill="#fff" fill-opacity=".75" stroke="#90bfe8"/>
  <text x="515" y="363" text-anchor="middle" class="title">Next.js / React</text>
  <text x="515" y="388" text-anchor="middle" class="small">Static interface served at /</text>
  <rect x="335" y="420" width="360" height="68" rx="12" fill="#fff" fill-opacity=".75" stroke="#90bfe8"/>
  <text x="515" y="448" text-anchor="middle" class="title">FastAPI</text>
  <text x="515" y="473" text-anchor="middle" class="small">Validation and JSON API under /api/v1</text>
  <text x="515" y="518" text-anchor="middle" class="small">Non-root image · port 8080 · min 0 · max 3</text>

  <rect x="790" y="210" width="905" height="390" rx="24" class="vpc"/>
  <text x="825" y="248" class="lane">CUSTOM VPC · PRIVATE DATABASE ROUTE</text>

  <rect x="825" y="290" width="225" height="140" class="box b"/>
  <text x="937" y="332" text-anchor="middle" class="title">Direct VPC egress</text>
  <text x="937" y="366" text-anchor="middle" class="copy">Private ranges only</text>
  <text x="937" y="393" text-anchor="middle" class="small">No connector instances</text>

  <rect x="1110" y="290" width="225" height="140" class="box b"/>
  <text x="1222" y="332" text-anchor="middle" class="title">VPC subnet</text>
  <text x="1222" y="366" text-anchor="middle" class="copy">Serverless network path</text>
  <text x="1222" y="393" text-anchor="middle" class="small">Flow logs enabled</text>

  <rect x="1395" y="290" width="255" height="140" class="box b"/>
  <text x="1522" y="332" text-anchor="middle" class="title">Private Service Access</text>
  <text x="1522" y="366" text-anchor="middle" class="copy">Service networking peering</text>
  <text x="1522" y="393" text-anchor="middle" class="small">Reserved internal range</text>

  <rect x="1110" y="470" width="540" height="100" class="box b"/>
  <text x="1380" y="507" text-anchor="middle" class="title">Cloud SQL for PostgreSQL</text>
  <text x="1380" y="539" text-anchor="middle" class="copy">Private IP only · PostgreSQL user signaldesk_app · backups and PITR</text>

  <path d="M225 332H300" class="blueLine"/><text x="263" y="314" text-anchor="middle" class="label">HTTPS</text>
  <path d="M730 382H825" class="blueLine"/><text x="777" y="363" text-anchor="middle" class="label">SQL</text>
  <path d="M1050 360H1110" class="blueLine"/>
  <path d="M1335 360H1395" class="blueLine"/>
  <path d="M1522 430V470" class="blueLine"/>

  <text x="300" y="654" class="lane">WORKLOAD IDENTITY &amp; OPERATIONS</text>
  <rect x="300" y="685" width="285" height="150" class="box g"/>
  <text x="442" y="727" text-anchor="middle" class="title">Runtime service account</text>
  <text x="442" y="762" text-anchor="middle" class="copy">Cloud SQL Client</text>
  <text x="442" y="790" text-anchor="middle" class="copy">Secret Manager accessor</text>
  <text x="442" y="814" text-anchor="middle" class="small">Not the PostgreSQL user</text>

  <rect x="645" y="685" width="285" height="150" class="box g"/>
  <text x="787" y="727" text-anchor="middle" class="title">Secret Manager</text>
  <text x="787" y="762" text-anchor="middle" class="copy">DB_PASSWORD reference</text>
  <text x="787" y="790" text-anchor="middle" class="copy">Injected at runtime</text>
  <text x="787" y="814" text-anchor="middle" class="small">Payload never stored in GitHub</text>

  <rect x="990" y="685" width="285" height="150" class="box n"/>
  <text x="1132" y="727" text-anchor="middle" class="title">Cloud Operations</text>
  <text x="1132" y="762" text-anchor="middle" class="copy">Structured request logs</text>
  <text x="1132" y="790" text-anchor="middle" class="copy">Monitoring and uptime check</text>
  <text x="1132" y="814" text-anchor="middle" class="small">Request ID correlation</text>

  <rect x="1335" y="685" width="315" height="150" class="box a"/>
  <text x="1492" y="727" text-anchor="middle" class="title">Reliability &amp; FinOps guardrails</text>
  <text x="1492" y="762" text-anchor="middle" class="copy">Readiness + liveness probes</text>
  <text x="1492" y="790" text-anchor="middle" class="copy">USD 10 monthly budget alerts</text>
  <text x="1492" y="814" text-anchor="middle" class="small">Budget alerts do not stop spend</text>

  <path d="M442 685V555H470V540" class="greenLine dash"/><text x="394" y="620" class="label">runs as</text>
  <path d="M585 760H645" class="greenLine"/><text x="615" y="742" text-anchor="middle" class="label">IAM</text>
  <path d="M787 685V620H630V540" class="greenLine"/><text x="704" y="604" text-anchor="middle" class="label">inject DB_PASSWORD</text>
  <path d="M690 500C825 625 980 585 1070 685" class="blueLine"/><text x="894" y="590" text-anchor="middle" class="label">logs + metrics</text>

  <rect x="300" y="880" width="1350" height="44" rx="12" fill="#fff" fill-opacity=".055"/>
  <text x="325" y="907" class="footerLabel">Authentication layers:</text>
  <text x="485" y="907" class="footerCopy">IAM authorizes the workload → private networking carries traffic → PostgreSQL validates DB_USER + injected password.</text>
</svg>
