<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">SignalDesk runtime and private data architecture</title>
  <desc id="desc">A Google Cloud runtime diagram showing a public HTTPS client, Cloud Run, a dedicated runtime service account, Secret Manager, Direct VPC egress, a custom subnet, Private Service Access, private Cloud SQL, Cloud Logging, Cloud Monitoring, and budget controls.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <marker id="dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#334155"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#15803d"/></marker>
    <symbol id="run" viewBox="0 0 512 512">
      <path fill="#fbbc04" d="M144.4 272c-6.4 0-12.4-3.8-14.9-10.1L55.4 75.9c-3.3-8.2.7-17.5 8.9-20.8 8.2-3.3 17.5.7 20.8 8.9l74.2 186c3.3 8.2-.7 17.5-8.9 20.8-1.9.8-3.9 1.1-5.9 1.1h-.1Z"/><path fill="#ea4335" d="M256 272c-6.4 0-12.4-3.8-14.9-10.1L167 75.9c-2.6-6.6-.6-14.1 5-18.5s13.4-4.5 19.2-.4l260.1 186c7.2 5.1 8.9 15.1 3.7 22.3s-15.1 8.9-22.3 3.7L216.9 114.7l54 135.3c3.3 8.2-.7 17.5-8.9 20.8-1.9.8-4 1.1-5.9 1.1h-.1Z"/><path fill="#34a853" d="m127.2 256-72 180c-3.3 8.2.7 17.5 8.9 20.8 3.1 1.2 4 1.1 5.9 1.1 6.3 0 12.4-3.8 14.9-10.1l74.4-186c.8-2 1.1-4 1.1-5.9h-33.2Z"/><path fill="#4285f4" d="M414.5 256 216.8 397.2l54.1-135.3c.8-2 1.1-4 1.1-5.9h-33.2l-72 180c-2.6 6.6-.6 14.1 5 18.5 2.9 2.3 6.4 3.4 9.9 3.4s6.5-1 9.3-3l260.4-186c4.4-3.1 6.7-8 6.7-13h-43.6Z"/>
    </symbol>
    <symbol id="sql" viewBox="0 0 512 512">
      <path fill="#fbbc04" d="m447.5 123.7-186-68.7c-3.6-1.3-7.5-1.3-11.1 0L64.5 123.5c-6.3 2.3-10.5 8.3-10.5 15s4.2 12.7 10.5 15l186 68.4c1.8.6 3.7 1 5.5 1s3.7-.3 5.5-1l185.9-68.2c6.3-2.3 10.5-8.3 10.5-15s-4.2-12.7-10.5-15H447.5ZM256 189.9l-139.6-51.4L256 87.1l139.7 51.6L256.1 190Z"/><path fill="#34a853" d="m447.5 388.8-185.9 68.2c-3.6 1.3-7.5 1.3-11 0L64.7 388.6c-8.3-3-12.5-12.2-9.5-20.5s12.2-12.5 20.5-9.5L256.1 425l180.4-66.2c8.3-3 17.5 1.2 20.5 9.5s-1.2 17.5-9.5 20.5Z"/><path fill="#34a853" d="m447.5 310.4-185.9 68.2c-3.6 1.3-7.5 1.3-11 0L64.7 310.2c-8.3-3-12.5-12.2-9.5-20.5s12.2-12.5 20.5-9.5l180.4 66.4 180.4-66.2c8.3-3 17.5 1.2 20.5 9.5s-1.2 17.5-9.5 20.5Z"/><path fill="#4285f4" d="m447.5 232.1-185.9 68.2c-3.6 1.4-7.5 1.3-11 0L64.7 231.9c-8.3-3.1-12.5-12.2-9.5-20.5 3-8.3 12.2-12.5 20.5-9.5l180.4 66.4 180.4-66.2c8.3-3 17.5 1.2 20.5 9.5s-1.2 17.5-9.5 20.5Z"/><path fill="#ea4335" d="M458 138.7c0 6.7-4.2 12.7-10.5 15l-186 68.2c-3.6 1.3-7.5 1.3-11 0l-40.8-15 46.4-17 139.6-51.2L256 87.1 209.8 70l40.7-15c3.6-1.3 7.5-1.3 11.1 0l186 68.7c6.3 2.3 10.5 8.3 10.5 15Z"/>
    </symbol>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.h1{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#475569}.bt{font-size:15px;font-weight:700}.bs{font-size:12px;fill:#64748b}.nt{font-size:15px;font-weight:700}.nc{font-size:12px;fill:#475569}.micro{font-size:11px;fill:#64748b}.badge{font-size:11px;font-weight:700;fill:white}.node{fill:white;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.bluebox{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.greenbox{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5}.amberbox{fill:#fffbeb;stroke:#fcd34d;stroke-width:1.5}.blueflow{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#blue)}.darkflow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#dark)}.greenflow{fill:none;stroke:#15803d;stroke-width:2.4;marker-end:url(#green)}.dash{stroke-dasharray:7 6}.label{font-size:11px;font-weight:600;fill:#1e3a8a;paint-order:stroke;stroke:#f8fafc;stroke-width:4px}.num{font-size:11px;font-weight:700;fill:white}
    </style>
  </defs>
  <rect width="1500" height="850" fill="#f8fafc"/>
  <text class="h1" x="45" y="45">SignalDesk runtime architecture</text>
  <text class="sub" x="45" y="70">Public serverless API · private PostgreSQL data path · observable and cost-bounded development environment</text>

  <rect x="300" y="100" width="1150" height="665" rx="18" fill="#fff" stroke="#4285f4" stroke-width="2.5"/>
  <rect x="300" y="100" width="1150" height="52" rx="18" fill="#e8f0fe"/><rect x="300" y="132" width="1150" height="20" fill="#e8f0fe"/>
  <text class="bt" x="328" y="132">Google Cloud project · kloudwithlucien-503200</text><text class="bs" x="1418" y="132" text-anchor="end">us-east1</text>

  <rect class="node" x="45" y="300" width="220" height="90" rx="14"/>
  <circle cx="79" cy="345" r="19" fill="#334155"/><text class="badge" x="79" y="349" text-anchor="middle">API</text>
  <text class="nt" x="112" y="335">Customer / client</text><text class="nc" x="112" y="357">Browser, mobile, or system</text><text class="micro" x="112" y="377">Unauthenticated demo endpoint</text>

  <rect x="330" y="175" width="760" height="550" rx="16" fill="#f8fafc" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="bt" x="355" y="207">Regional application plane</text><text class="bs" x="355" y="228">Managed compute attaches to private ranges without a connector VM</text>

  <rect class="node" x="375" y="285" width="275" height="135" rx="14"/>
  <use href="#run" x="398" y="319" width="55" height="55"/>
  <text class="nt" x="472" y="317">Cloud Run · signaldesk-dev</text><text class="nc" x="472" y="340">Public ingress · HTTPS</text><text class="nc" x="472" y="361">0–3 instances · 1 vCPU · 512 MiB</text><text class="micro" x="472" y="383">Startup + liveness probes</text><text class="micro" x="472" y="401">Dedicated runtime service account</text>

  <rect class="amberbox" x="755" y="185" width="250" height="105" rx="13"/>
  <rect x="778" y="211" width="42" height="42" rx="10" fill="#f59e0b"/><text class="badge" x="799" y="237" text-anchor="middle">SM</text>
  <text class="nt" x="838" y="220">Secret Manager</text><text class="nc" x="838" y="242">Database password reference</text><text class="micro" x="838" y="263">Value injected at runtime</text>

  <rect x="375" y="490" width="670" height="195" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="1.75" stroke-dasharray="8 5"/>
  <text class="bt" x="400" y="521">Custom VPC · signaldesk-dev</text><text class="bs" x="400" y="542">Regional routing · deny-ingress firewall logging</text>
  <rect class="bluebox" x="415" y="575" width="250" height="72" rx="11"/><text class="nt" x="437" y="604">Subnet · 10.10.0.0/24</text><text class="nc" x="437" y="626">Flow logs · private Google access</text>
  <rect class="bluebox" x="730" y="575" width="275" height="72" rx="11"/><text class="nt" x="752" y="604">Private Service Access</text><text class="nc" x="752" y="626">Reserved /16 + service peering</text>

  <rect class="node" x="1125" y="475" width="275" height="170" rx="14"/>
  <use href="#sql" x="1148" y="505" width="55" height="55"/>
  <text class="nt" x="1220" y="505">Cloud SQL</text><text class="nc" x="1220" y="528">PostgreSQL 18 Enterprise</text><text class="nc" x="1148" y="574">Private IPv4 only · SSL client cert required</text><text class="nc" x="1148" y="596">Zonal dev · 7 backups · 7-day PITR</text><text class="micro" x="1148" y="619">Query Insights + PostgreSQL audit flags</text>

  <rect x="1125" y="175" width="275" height="235" rx="14" fill="#f8fafc" stroke="#86efac" stroke-width="1.5"/>
  <text class="bt" x="1148" y="205">Operations and cost</text>
  <rect class="greenbox" x="1148" y="228" width="229" height="52" rx="10"/><circle cx="1172" cy="254" r="14" fill="#16a34a"/><text class="badge" x="1172" y="258" text-anchor="middle">L</text><text class="nt" x="1198" y="251">Cloud Logging</text><text class="micro" x="1198" y="268">Request IDs + VPC logs</text>
  <rect class="greenbox" x="1148" y="292" width="229" height="52" rx="10"/><circle cx="1172" cy="318" r="14" fill="#15803d"/><text class="badge" x="1172" y="322" text-anchor="middle">M</text><text class="nt" x="1198" y="315">Cloud Monitoring</text><text class="micro" x="1198" y="332">60-second readiness check</text>
  <rect class="amberbox" x="1148" y="356" width="229" height="38" rx="10"/><text class="nc" x="1168" y="380">$10 budget · 50 / 90 / 100% alerts</text>

  <path class="darkflow" d="M265 345H375"/><circle cx="320" cy="345" r="11" fill="#334155"/><text class="num" x="320" y="349" text-anchor="middle">1</text><text class="label" x="285" y="329">HTTPS</text>
  <path class="blueflow dash" d="M755 238H690V320H650"/><circle cx="690" cy="320" r="11" fill="#2563eb"/><text class="num" x="690" y="324" text-anchor="middle">2</text><text class="label" x="666" y="222">secret reference</text>
  <path class="darkflow" d="M512 420V575"/><circle cx="512" cy="462" r="11" fill="#334155"/><text class="num" x="512" y="466" text-anchor="middle">3</text><text class="label" x="530" y="463">Direct VPC egress · private ranges only</text>
  <path class="darkflow" d="M665 611H730"/><circle cx="699" cy="611" r="11" fill="#334155"/><text class="num" x="699" y="615" text-anchor="middle">4</text>
  <path class="darkflow" d="M1005 611H1090V560H1125"/><circle cx="1090" cy="560" r="11" fill="#334155"/><text class="num" x="1090" y="564" text-anchor="middle">5</text><text class="label" x="1026" y="598">private IP</text>
  <path class="greenflow" d="M650 335H1095V254H1148"/><circle cx="1095" cy="254" r="11" fill="#15803d"/><text class="num" x="1095" y="258" text-anchor="middle">6</text><text class="label" x="907" y="327">structured logs + metrics</text>
  <path class="greenflow dash" d="M1148 318H1080V390H650"/><circle cx="1080" cy="390" r="11" fill="#15803d"/><text class="num" x="1080" y="394" text-anchor="middle">7</text><text class="label" x="900" y="383">GET /health/ready</text>

  <rect x="330" y="735" width="1070" height="46" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <line x1="360" y1="758" x2="405" y2="758" class="darkflow"/><text class="micro" x="420" y="762">runtime and private data</text><line x1="650" y1="758" x2="695" y2="758" class="blueflow dash"/><text class="micro" x="710" y="762">secret/control reference</text><line x1="955" y1="758" x2="1000" y2="758" class="greenflow"/><text class="micro" x="1015" y="762">health, logs, and metrics</text>
  <text class="micro" x="45" y="824">Security boundary note: Cloud Run and Cloud SQL are managed services; the dashed VPC box represents the private network path, not servers placed inside the subnet.</text>
</svg>
