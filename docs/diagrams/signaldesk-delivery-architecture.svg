<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" role="img" aria-labelledby="title desc">
  <title id="title">SignalDesk keyless CI/CD and infrastructure delivery architecture</title>
  <desc id="desc">A delivery diagram showing one-time bootstrap, pull request security gates, protected main delivery, separate Workload Identity Federation paths for infrastructure and applications, exact Terraform plan approval, immutable image deployment, zero-traffic candidate testing, and promotion.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <marker id="violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7c3aed"/></marker>
    <marker id="dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#334155"/></marker>
    <symbol id="run" viewBox="0 0 512 512">
      <path fill="#fbbc04" d="M144.4 272c-6.4 0-12.4-3.8-14.9-10.1L55.4 75.9c-3.3-8.2.7-17.5 8.9-20.8 8.2-3.3 17.5.7 20.8 8.9l74.2 186c3.3 8.2-.7 17.5-8.9 20.8-1.9.8-3.9 1.1-5.9 1.1h-.1Z"/><path fill="#ea4335" d="M256 272c-6.4 0-12.4-3.8-14.9-10.1L167 75.9c-2.6-6.6-.6-14.1 5-18.5s13.4-4.5 19.2-.4l260.1 186c7.2 5.1 8.9 15.1 3.7 22.3s-15.1 8.9-22.3 3.7L216.9 114.7l54 135.3c3.3 8.2-.7 17.5-8.9 20.8-1.9.8-4 1.1-5.9 1.1h-.1Z"/><path fill="#34a853" d="m127.2 256-72 180c-3.3 8.2.7 17.5 8.9 20.8 3.1 1.2 4 1.1 5.9 1.1 6.3 0 12.4-3.8 14.9-10.1l74.4-186c.8-2 1.1-4 1.1-5.9h-33.2Z"/><path fill="#4285f4" d="M414.5 256 216.8 397.2l54.1-135.3c.8-2 1.1-4 1.1-5.9h-33.2l-72 180c-2.6 6.6-.6 14.1 5 18.5 2.9 2.3 6.4 3.4 9.9 3.4s6.5-1 9.3-3l260.4-186c4.4-3.1 6.7-8 6.7-13h-43.6Z"/>
    </symbol>
    <symbol id="storage" viewBox="0 0 512 512">
      <path fill="#34a853" d="M442 277.9H70c-8.8 0-16 7.2-16 16V442c0 8.8 7.2 16 16 16h372c8.8 0 16-7.2 16-16V293.9c0-8.8-7.2-16-16-16ZM86 309.9h80V426H86V309.9ZM426 425.9H198V309.8h228v116.1Z"/><path fill="#fbbc04" d="M442 54H70c-8.8 0-16 7.2-16 16v148.8c0 8.8 7.2 16 16 16h372c8.8 0 16-7.2 16-16V70c0-8.8-7.2-16-16-16ZM86 86h80v116.8H86V86Zm340 116.8H198V86h228v116.8Z"/><path fill="#ea4335" d="M442 234.8h-16V86H54V70c0-8.8 7.2-16 16-16h372c8.8 0 16 7.2 16 16v148.8c0 8.8-7.2 16-16 16Z"/><path fill="#4285f4" d="M442 457.9h-16V309.8H54v-16c0-8.8 7.2-16 16-16h372c8.8 0 16 7.2 16 16V442c0 8.8-7.2 16-16 16Z"/>
    </symbol>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.h1{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#475569}.bt{font-size:15px;font-weight:700}.bs{font-size:12px;fill:#64748b}.nt{font-size:14px;font-weight:700}.nc{font-size:11px;fill:#475569}.micro{font-size:10.5px;fill:#64748b}.badge{font-size:10px;font-weight:700;fill:#fff}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.bluebox{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.violetbox{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:1.5}.greenbox{fill:#f0fdf4;stroke:#86efac;stroke-width:1.5}.amberbox{fill:#fffbeb;stroke:#fcd34d;stroke-width:1.5}.blueflow{fill:none;stroke:#2563eb;stroke-width:2.3;marker-end:url(#blue)}.violetflow{fill:none;stroke:#7c3aed;stroke-width:2.3;marker-end:url(#violet)}.darkflow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#dark)}.dash{stroke-dasharray:7 6}.label{font-size:10.5px;font-weight:600;fill:#1e3a8a;paint-order:stroke;stroke:#f8fafc;stroke-width:4px}.num{font-size:10px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1800" height="920" fill="#f8fafc"/>
  <text class="h1" x="45" y="45">SignalDesk keyless CI/CD and release architecture</text>
  <text class="sub" x="45" y="70">One-time trust bootstrap · credential-free pull requests · exact-plan approval · immutable, smoke-tested promotion</text>

  <!-- Bootstrap -->
  <rect x="40" y="105" width="1720" height="145" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="1.75"/>
  <text class="bt" x="65" y="135">One-time bootstrap trust root</text><text class="bs" x="65" y="155">Run locally by the project owner; deliberately excluded from automatic delivery</text>
  <rect class="node" x="65" y="175" width="225" height="54" rx="11"/><circle cx="90" cy="202" r="14" fill="#0f172a"/><text class="badge" x="90" y="206" text-anchor="middle">1×</text><text class="nt" x="115" y="199">Owner + ADC</text><text class="micro" x="115" y="216">reviewed Terraform apply</text>
  <path class="blueflow dash" d="M290 202H350"/><text class="label" x="306" y="188">creates</text>
  <rect class="bluebox" x="350" y="175" width="250" height="54" rx="11"/><text class="nt" x="372" y="199">Two WIF pools + providers</text><text class="micro" x="372" y="216">immutable repo/owner/workflow claims</text>
  <rect class="bluebox" x="630" y="175" width="250" height="54" rx="11"/><text class="nt" x="652" y="199">Two deploy service accounts</text><text class="micro" x="652" y="216">infrastructure ≠ application identity</text>
  <rect class="greenbox" x="910" y="175" width="250" height="54" rx="11"/><use href="#storage" x="928" y="185" width="35" height="35"/><text class="nt" x="975" y="199">Versioned state bucket</text><text class="micro" x="975" y="216">public access prevention + audit logs</text>
  <rect class="amberbox" x="1190" y="175" width="260" height="54" rx="11"/><text class="nt" x="1212" y="199">No service-account keys</text><text class="micro" x="1212" y="216">short-lived OIDC credentials only</text>
  <rect class="node" x="1480" y="175" width="250" height="54" rx="11"/><text class="nt" x="1502" y="199">Bootstrap state migrated</text><text class="micro" x="1502" y="216">local → protected GCS backend</text>

  <!-- Delivery boundary -->
  <rect x="40" y="280" width="1720" height="550" rx="18" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <rect x="40" y="280" width="1720" height="48" rx="18" fill="#f6f8fa"/><rect x="40" y="310" width="1720" height="18" fill="#f6f8fa"/>
  <text class="bt" x="65" y="310">GitHub Actions delivery boundary</text><text class="bs" x="1725" y="310" text-anchor="end">push to protected main · concurrency: one delivery at a time</text>

  <rect class="node" x="70" y="365" width="190" height="84" rx="12"/><text class="nt" x="92" y="393">Pull request</text><text class="nc" x="92" y="415">Code + IaC review</text><text class="micro" x="92" y="434">contents: read · no OIDC</text>
  <path class="darkflow" d="M260 407H300"/><circle cx="280" cy="407" r="10" fill="#334155"/><text class="num" x="280" y="411" text-anchor="middle">1</text>
  <rect class="violetbox" x="300" y="350" width="230" height="114" rx="12"/><text class="nt" x="322" y="378">Quality + security gates</text><text class="nc" x="322" y="400">Ruff · Bandit · pytest · pip-audit</text><text class="nc" x="322" y="420">Checkov · OPA tests · Trivy</text><text class="micro" x="322" y="442">actionlint · image scan · SBOM</text>
  <path class="darkflow" d="M530 407H570"/>
  <rect class="bluebox" x="570" y="365" width="175" height="84" rx="12"/><text class="nt" x="592" y="393">Protected main</text><text class="nc" x="592" y="415">Trusted commit SHA</text><text class="micro" x="592" y="434">path-selects delivery</text>

  <!-- Infrastructure lane -->
  <rect x="780" y="348" width="945" height="195" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="bt" x="805" y="378">Infrastructure lane</text><text class="bs" x="1700" y="378" text-anchor="end">environment: infrastructure-plan → infrastructure-development</text>
  <path class="blueflow" d="M745 390H805"/><circle cx="775" cy="390" r="10" fill="#2563eb"/><text class="num" x="775" y="394" text-anchor="middle">2</text>
  <rect class="bluebox" x="805" y="400" width="155" height="78" rx="11"/><text class="nt" x="827" y="425">Infra WIF</text><text class="nc" x="827" y="445">OIDC claim check</text><text class="micro" x="827" y="463">impersonate infra SA</text>
  <path class="blueflow" d="M960 439H990"/>
  <rect class="node" x="990" y="400" width="155" height="78" rx="11"/><text class="nt" x="1012" y="425">Terraform plan</text><text class="nc" x="1012" y="445">binary tfplan</text><text class="micro" x="1012" y="463">remote state lock</text>
  <path class="blueflow" d="M1145 439H1175"/>
  <rect class="violetbox" x="1175" y="400" width="155" height="78" rx="11"/><text class="nt" x="1197" y="425">OPA + SHA-256</text><text class="nc" x="1197" y="445">real plan JSON</text><text class="micro" x="1197" y="463">fail closed</text>
  <path class="blueflow" d="M1330 439H1360"/>
  <rect class="greenbox" x="1360" y="400" width="155" height="78" rx="11"/><use href="#storage" x="1378" y="418" width="35" height="35"/><text class="nt" x="1423" y="426">Protected GCS</text><text class="nc" x="1423" y="446">plan + checksum</text><text class="micro" x="1423" y="464">one-day lifecycle</text>
  <path class="blueflow" d="M1515 439H1545"/>
  <rect class="amberbox" x="1545" y="400" width="155" height="78" rx="11"/><text class="nt" x="1567" y="425">Approve + apply</text><text class="nc" x="1567" y="445">verify checksum</text><text class="micro" x="1567" y="463">apply exact tfplan</text>
  <text class="micro" x="805" y="518">Result: APIs, IAM, VPC, private Cloud SQL, Secret Manager, Cloud Run platform, monitoring, and budget reconcile from Terraform.</text>

  <!-- Application lane -->
  <rect x="780" y="575" width="945" height="205" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="bt" x="805" y="605">Application release lane</text><text class="bs" x="1700" y="605" text-anchor="end">environment: development · build once, deploy by immutable digest</text>
  <path class="violetflow" d="M745 427H760V677H805"/><circle cx="775" cy="677" r="10" fill="#7c3aed"/><text class="num" x="775" y="681" text-anchor="middle">3</text>
  <rect class="violetbox" x="805" y="630" width="155" height="94" rx="11"/><text class="nt" x="827" y="655">Build once</text><text class="nc" x="827" y="675">Trivy image gate</text><text class="nc" x="827" y="694">CycloneDX SBOM</text><text class="micro" x="827" y="712">commit-SHA tag</text>
  <path class="violetflow" d="M960 677H990"/>
  <rect class="violetbox" x="990" y="630" width="155" height="94" rx="11"/><text class="nt" x="1012" y="655">App WIF</text><text class="nc" x="1012" y="675">OIDC claim check</text><text class="nc" x="1012" y="694">impersonate app SA</text><text class="micro" x="1012" y="712">AR writer + Run developer</text>
  <path class="violetflow" d="M1145 677H1175"/>
  <rect class="greenbox" x="1175" y="630" width="155" height="94" rx="11"/><rect x="1195" y="649" width="35" height="35" rx="8" fill="#34a853"/><text class="badge" x="1212" y="671" text-anchor="middle">AR</text><text class="nt" x="1240" y="656">Artifact Registry</text><text class="nc" x="1240" y="677">push + resolve digest</text><text class="micro" x="1197" y="706">sha256:… becomes deployment input</text>
  <path class="violetflow" d="M1330 677H1360"/>
  <rect class="node" x="1360" y="630" width="155" height="94" rx="11"/><use href="#run" x="1380" y="650" width="38" height="38"/><text class="nt" x="1428" y="656">Candidate</text><text class="nc" x="1428" y="677">Cloud Run revision</text><text class="micro" x="1382" y="706">zero production traffic</text>
  <path class="violetflow" d="M1515 677H1545"/>
  <rect class="greenbox" x="1545" y="630" width="155" height="94" rx="11"/><text class="nt" x="1567" y="655">Verify + promote</text><text class="nc" x="1567" y="675">/health/ready</text><text class="nc" x="1567" y="694">candidate → 100%</text><text class="micro" x="1567" y="712">public recheck</text>
  <text class="micro" x="805" y="758">Failure behavior: a bad candidate keeps zero traffic, so the previously serving revision remains live.</text>

  <rect x="70" y="500" width="675" height="280" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="bt" x="95" y="532">Why the split matters</text>
  <circle cx="108" cy="565" r="12" fill="#2563eb"/><text class="badge" x="108" y="569" text-anchor="middle">I</text><text class="nt" x="132" y="562">Infrastructure identity</text><text class="nc" x="132" y="581">Can reconcile platform resources and protected state.</text>
  <circle cx="108" cy="620" r="12" fill="#7c3aed"/><text class="badge" x="108" y="624" text-anchor="middle">A</text><text class="nt" x="132" y="617">Application identity</text><text class="nc" x="132" y="636">Can publish images and deploy revisions, not rewrite WIF or state.</text>
  <circle cx="108" cy="675" r="12" fill="#334155"/><text class="badge" x="108" y="679" text-anchor="middle">P</text><text class="nt" x="132" y="672">Pull-request jobs</text><text class="nc" x="132" y="691">Read repository content only; they cannot obtain cloud write credentials.</text>
  <circle cx="108" cy="730" r="12" fill="#15803d"/><text class="badge" x="108" y="734" text-anchor="middle">✓</text><text class="nt" x="132" y="727">Artifact integrity</text><text class="nc" x="132" y="746">Approved plan and released image are identified by cryptographic digests.</text>

  <rect x="40" y="850" width="1720" height="38" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <line x1="75" y1="869" x2="120" y2="869" class="blueflow"/><text class="micro" x="135" y="873">infrastructure identity / plan</text><line x1="430" y1="869" x2="475" y2="869" class="violetflow"/><text class="micro" x="490" y="873">application identity / release</text><line x1="780" y1="869" x2="825" y2="869" class="darkflow"/><text class="micro" x="840" y="873">repository control flow</text><line x1="1090" y1="869" x2="1135" y2="869" class="blueflow dash"/><text class="micro" x="1150" y="873">one-time bootstrap</text><text class="micro" x="1725" y="873" text-anchor="end">No long-lived CI keys</text>
</svg>
