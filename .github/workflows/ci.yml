name: Application quality

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check app

      - name: Run Python static security analysis
        run: python -m bandit -q -r app/signaldesk

      - name: Run application tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -m pytest app/tests -q

  dependency_audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install the dependency auditor
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit production dependencies
        run: python -m pip_audit -r app/requirements.txt
