name: Application quality

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix app/frontend

      - name: Lint Python
        run: python -m ruff check app

      - name: Run Python static security analysis
        run: python -m bandit -q -r app/signaldesk

      - name: Run application tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -m pytest app/tests -q

      - name: Lint and unit-test the frontend
        run: |
          npm --prefix app/frontend run lint
          npm --prefix app/frontend run test

      - name: Build the production frontend
        run: npm --prefix app/frontend run build

      - name: Install the end-to-end test browser
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Exercise booking and operations journeys
        working-directory: app/frontend
        run: npx playwright test

      - name: Preserve failed browser-test evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  dependency_audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install the dependency auditor
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit production dependencies
        run: python -m pip_audit -r app/requirements.txt

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Audit the locked frontend dependency tree
        run: npm audit --prefix app/frontend --audit-level=high
