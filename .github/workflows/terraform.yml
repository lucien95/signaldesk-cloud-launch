name: Terraform quality

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/bootstrap
          - terraform/environments/dev
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Verify Terraform formatting
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate
