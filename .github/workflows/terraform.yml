name: Terraform quality

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/bootstrap
          - terraform/environments/dev
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8

      - name: Verify Terraform formatting
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate
